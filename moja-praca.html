<script>
// The tabs above are pure CSS (radio + :checked), which is great for
// no-JS support, but it means a URL hash like "#sports" has no way to
// check the matching radio button on its own - the browser just tries
// to jump to the element with that id while the tab it's inside stays
// hidden. This tiny script bridges that gap for deep links such as
// moja-praca.html#sports coming from the homepage teasers.
(function () {
  var hashToTab = {
    portraits: 'tab-portraits',
    sports: 'tab-sports',
    events: 'tab-events'
  };
  var hashToPanel = {
    portraits: 'panel-portraits',
    sports: 'panel-sports',
    events: 'panel-events'
  };

  function selectFromHash() {
    var key = location.hash.replace('#', '');
    var tabId = hashToTab[key];
    if (!tabId) return;

    var radio = document.getElementById(tabId);
    if (radio) radio.checked = true;

    var panel = document.getElementById(hashToPanel[key]);
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.addEventListener('DOMContentLoaded', selectFromHash);
  window.addEventListener('hashchange', selectFromHash);
})();
</script>
