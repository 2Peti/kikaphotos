<script>
// The tabs above are pure CSS (radio + :checked), which is great for
// no-JS support, but it means a URL hash like "#sports" has no way to
// check the matching radio button on its own - the browser just tries
// to jump to the element with that id while the tab it's inside stays
// hidden. This tiny script bridges that gap for deep links such as
// moja-praca.html#sports coming from the homepage teasers.
(function () {
  var hashToTab = {
    portraits: 'tab-portraits',
    sports: 'tab-sports',
    events: 'tab-events'
  };
  var hashToPanel = {
    portraits: 'panel-portraits',
    sports: 'panel-sports',
    events: 'panel-events'
  };

  function selectFromHash() {
    var key = location.hash.replace('#', '');
    var tabId = hashToTab[key];
    if (!tabId) return;

    var radio = document.getElementById(tabId);
    if (radio) radio.checked = true;

    var panel = document.getElementById(hashToPanel[key]);
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.addEventListener('DOMContentLoaded', selectFromHash);
  window.addEventListener('hashchange', selectFromHash);
})();
</script>

<script>
// Lightbox: clicking a thumbnail opens the full-resolution image.
// Built with plain DOM APIs so it works without any extra dependency.
(function () {
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = lightbox.querySelector('.lightbox-img');
  var closeBtn = lightbox.querySelector('.lightbox-close');
  var prevBtn = lightbox.querySelector('.lightbox-prev');
  var nextBtn = lightbox.querySelector('.lightbox-next');
  var currentGroup = [];
  var currentIndex = 0;

  function groupFor(link) {
    var panel = link.closest('.tab-panel');
    return Array.prototype.slice.call(panel.querySelectorAll('.lightbox-link'));
  }

  function show(index) {
    if (!currentGroup.length) return;
    currentIndex = (index + currentGroup.length) % currentGroup.length;
    var link = currentGroup[currentIndex];
    lightboxImg.src = link.getAttribute('data-full');
    lightboxImg.alt = link.querySelector('img').alt;
  }

  function open(link) {
    currentGroup = groupFor(link);
    currentIndex = currentGroup.indexOf(link);
    show(currentIndex);
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function close() {
    lightbox.hidden = true;
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.lightbox-link').forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      open(link);
    });
  });

  closeBtn.addEventListener('click', close);
  nextBtn.addEventListener('click', function () { show(currentIndex + 1); });
  prevBtn.addEventListener('click', function () { show(currentIndex - 1); });

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) close();
  });

  document.addEventListener('keydown', function (e) {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') show(currentIndex + 1);
    if (e.key === 'ArrowLeft') show(currentIndex - 1);
  });
})();
</script>
